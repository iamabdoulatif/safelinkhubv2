<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SafeLinkHub">
  <!-- Marque SafeLinkHub (chip) : pastille lime de la charte, S routé + port en
       encre. Entièrement GÉOMÉTRIQUE, sans texte (ce SVG est servi tel quel au
       navigateur — une lettre dépendrait de la police du système). Lisible à
       16 px, taille réelle d'un onglet. -->
  <rect width="64" height="64" rx="14" fill="#D6F344"/>
  <path d="M48 16 H26 V32 H38 V46.4 H15.6" fill="none" stroke="#151515"
        stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="45" y="9" width="12" height="12" rx="3.2" fill="#151515"/>
</svg>
