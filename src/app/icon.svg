<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SafeLinkHub">
  <!-- Marque SafeLinkHub : aplat lime de la charte, onde Wi-Fi en vert profond.
       Entièrement GÉOMÉTRIQUE, sans texte : une lettre dépendrait de la police
       du système du visiteur, puisque ce SVG est servi tel quel au navigateur —
       le rendu changerait d'une machine à l'autre. Les arcs restent lisibles
       à 16 px, taille réelle d'un onglet. -->
  <rect width="64" height="64" rx="14" fill="#D6F344"/>
  <g fill="none" stroke="#12301D" stroke-linecap="round">
    <path d="M14 28.5a26 26 0 0 1 36 0" stroke-width="6"/>
    <path d="M22.5 38a15 15 0 0 1 19 0" stroke-width="6"/>
  </g>
  <circle cx="32" cy="47.5" r="4.5" fill="#12301D"/>
</svg>
