<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Connexion en cours...">
  <meta name="theme-color" content="#10b981">
  <title>Connexion réussie - {{SSID}}</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310b981'/%3E%3Cpath d='M50 85c-2 0-4-1-5-3-8-14-12-28-12-42 0-9 8-17 17-17s17 8 17 17c0 14-4 28-12 42-1 2-3 3-5 3z' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/style.css?v=20260626-003">

  <!-- No-cache pour éviter les problèmes de cache MikroTik -->
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <!-- Redirection fiable (même si JS est bloqué dans le pop-up) -->
  <meta http-equiv="refresh" content="2; url=$(link-redirect)" />

  <style>
    body { opacity: 0; transition: opacity 0.3s ease; }
    body.loaded { opacity: 1; }
    .alogin-card { text-align: center; padding: 48px 32px; }
  </style>

  <script>
    // Gestion du pop-up captive portal (inspiré de SMART-CONNECT)
    function startClock() {
      $(if popup == 'true')
        open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
      $(endif)
      // Si on est dans un pop-up, on tente de fermer après ouverture du status
      $(if popup == 'true')
        setTimeout(function() { window.close(); }, 500);
      $(endif)
    }
  </script>
</head>
<body onload="startClock()">

  <div class="hotspot-container">
    <div class="card alogin-card animate-fade-in">
      <div class="loader loader-dark" style="width: 48px; height: 48px; border-width: 4px; margin: 0 auto 24px;"></div>
      <h1 class="page-title">Connexion réussie</h1>
      <p class="page-message">
        Vous êtes maintenant connecté à Internet.<br>
        Redirection vers votre page de destination...
      </p>
      <p style="margin-top: 16px; font-size: 0.85rem; word-break: break-all; color: var(--text-muted);">
        <a href="$(link-redirect)" style="color: var(--primary);">$(link-redirect)</a>
      </p>
    </div>

    <footer class="footer">
      <div class="footer-brand">Powered by <strong>{{SSID}}</strong></div>
    </footer>
  </div>

  <script src="js/app.js?v=20260626-003"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');
      // Redirection automatique vers la destination originale
      setTimeout(function() {
        window.location.href = "$(link-redirect)";
      }, 1500);
    });
  </script>
</body>
</html>
