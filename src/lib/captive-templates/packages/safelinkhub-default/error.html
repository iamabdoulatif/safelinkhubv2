<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="description" content="Erreur de connexion WiFi">
  <meta name="theme-color" content="#ef4444">
  <title>Erreur - {{SSID}}</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2310b981'/%3E%3Cpath d='M50 85c-2 0-4-1-5-3-8-14-12-28-12-42 0-9 8-17 17-17s17 8 17 17c0 14-4 28-12 42-1 2-3 3-5 3z' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/style.css?v=20260626-003">

  <style>
    body { opacity: 0; transition: opacity 0.3s ease; }
    body.loaded { opacity: 1; }
  </style>
</head>
<body>

  <div class="hotspot-container">
    <div class="card animate-fade-in" style="text-align: center;">

      <div class="page-icon page-icon-error">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>

      <h1 class="page-title">Erreur de connexion</h1>
      <p class="page-message">
        Une erreur s'est produite lors de la tentative de connexion.<br>
        Veuillez vérifier votre code d'accès et réessayer.
      </p>

      $(if error)
      <div class="alert alert-error" role="alert" style="text-align: left; margin-top: 16px;">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>$(error)</span>
      </div>
      $(endif)

      <div style="margin-top: 24px;">
        <a href="$(link-login)" class="btn btn-primary" style="max-width: 280px; margin: 0 auto;">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Retour à la connexion
        </a>
      </div>

      <div style="margin-top: 16px;">
        <a href="tel:+225XXXXXXXXX" class="btn btn-secondary" style="max-width: 280px; margin: 0 auto; width: auto;">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          Contacter le support
        </a>
      </div>

    </div>

    <footer class="footer">
      <div class="footer-brand">Powered by <strong>{{SSID}}</strong></div>
    </footer>
  </div>

  <script src="js/app.js?v=20260626-003"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('loaded');
    });
  </script>
</body>
</html>
