<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLink Africa - Statut</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero-header" style="padding-bottom:24px;">
        <div class="brand">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                    <line x1="12" y1="20" x2="12.01" y2="20"/>
                </svg>
            </div>
            <div>
                <h1 class="brand-name">SafeLink Africa</h1>
                <p class="brand-tagline">Statut de connexion</p>
            </div>
        </div>
    </header>

    <div class="section-card visible" style="text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:12px;">&#128994;</div>
        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:6px;color:#16a34a;">Connect&eacute;</h2>
        <p style="font-size:0.85rem;color:#64748b;margin-bottom:20px;">Vous &ecirc;tes connect&eacute; au r&eacute;seau WiFi SafeLink Africa</p>

        <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:16px;margin-bottom:16px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <span style="font-size:0.78rem;color:#64748b;font-weight:600;">Utilisateur</span>
                <span style="font-size:0.85rem;font-weight:700;">$(username)</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <span style="font-size:0.78rem;color:#64748b;font-weight:600;">Adresse IP</span>
                <span style="font-size:0.85rem;font-weight:700;">$(ip)</span>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
                <span style="font-size:0.78rem;color:#64748b;font-weight:600;">Temps restant</span>
                <span style="font-size:0.85rem;font-weight:700;color:#ea580c;">$(remaining)</span>
            </div>
            <div style="display:flex;justify-content:space-between;">
                <span style="font-size:0.78rem;color:#64748b;font-weight:600;">Connect&eacute; depuis</span>
                <span style="font-size:0.85rem;font-weight:700;">$(uptime)</span>
            </div>
        </div>

        <a href="$(link-logout)" class="btn-connect" style="display:flex;text-decoration:none;background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(239,68,68,0.3);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Se D&eacute;connecter
        </a>
    </div>

    <footer class="footer">
        <p class="footer-copy">&copy; 2026 SafeLink Africa. Tous droits r&eacute;serv&eacute;s.</p>
        <p class="footer-designed">Con&ccedil;u par <strong>SafeLink Africa</strong></p>
    </footer>
</body>
</html>
