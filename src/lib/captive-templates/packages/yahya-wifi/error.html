<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLink Africa - Erreur</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="section-card visible" style="margin-top:40px;text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:12px;">&#9888;&#65039;</div>
        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:8px;color:#dc2626;">Erreur</h2>
        <p style="font-size:0.85rem;color:#64748b;margin-bottom:16px;">$(error-orig)</p>

        <div class="error-msg" style="justify-content:center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            $(error)
        </div>

        <a href="$(link-login)" class="btn-connect" style="display:flex;text-decoration:none;margin-top:20px;">
            Retour &agrave; la connexion
        </a>
    </div>

    <footer class="footer">
        <p class="footer-copy">&copy; 2026 SafeLink Africa</p>
    </footer>
</body>
</html>
