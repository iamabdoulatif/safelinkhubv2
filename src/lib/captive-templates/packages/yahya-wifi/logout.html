<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeLink Africa - D&eacute;connect&eacute;</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="section-card visible" style="margin-top:40px;text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:12px;">&#128075;</div>
        <h2 style="font-size:1.2rem;font-weight:800;margin-bottom:8px;">D&eacute;connect&eacute;</h2>
        <p style="font-size:0.85rem;color:#64748b;margin-bottom:20px;">Vous avez &eacute;t&eacute; d&eacute;connect&eacute; du r&eacute;seau WiFi</p>

        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:20px;">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                <span style="font-size:0.78rem;color:#64748b;font-weight:600;">Dur&eacute;e totale</span>
                <span style="font-size:0.85rem;font-weight:700;">$(uptime)</span>
            </div>
        </div>

        <a href="$(link-login)" class="btn-connect" style="display:flex;text-decoration:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Se Reconnecter
        </a>
    </div>

    <footer class="footer">
        <p class="footer-copy">&copy; 2026 SafeLink Africa</p>
        <p class="footer-designed">Con&ccedil;u par <strong>SafeLink Africa</strong></p>
    </footer>
</body>
</html>
