name: Build & deploy (self-hosted VPS)

# Builds the Docker image in GitHub's runners (the 1 vCPU / 4 GB VPS can't build
# Next.js reliably), pushes it to GHCR, then SSHes into the Hostinger VPS to
# pull + restart the container. Runs on pushes to main and can be triggered by
# hand. Vercel keeps working in parallel until you decommission it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Garde-fou AVANT de construire quoi que ce soit. La CI ne vérifiait rien :
  # elle construisait l'image et la poussait, sans typecheck ni tests — et 42
  # fichiers de tests étaient de toute façon inexécutables (imports TS sans
  # extension, que `node --test` seul ne résout pas ; d'où tsx).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_APP_URL is inlined at build time (see Dockerfile) — it
          # must be passed here, not just set at runtime, or router install
          # commands are generated pointing at localhost.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://safelinkhub.io
          # BuildKit secret the Dockerfile mounts at `npm run build`.
          # The build runs WITHOUT a database — see the Dockerfile for why.
          # Only the Server Actions encryption key is passed, so action IDs
          # stay stable across rebuilds.
          secrets: |
            sakey=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Image MikHmon v6, publiée sur NOTRE registre.
  #
  # POURQUOI ELLE NE PEUT PAS RESTER LOCALE : le script de déploiement fait un
  # `docker image prune -af` à chaque bascule, qui efface toute image sans
  # conteneur en marche. Une image v6 construite à la main sur le relais
  # disparaît donc au premier déploiement suivant.
  #
  # ET POURQUOI PAS UN NOM DOCKER HUB : `safelinkhub/mikhmon-v6` ne nous
  # appartient pas. Image absente en local, Docker va la chercher sur Docker
  # Hub — le jour où quelqu'un publie ce nom, le relais lancerait l'image d'un
  # inconnu avec les identifiants des routeurs.
  #
  # Ne se reconstruit que si sa recette change : l'image est épinglée sur un
  # commit amont, donc reconstruire à chaque push produirait le même contenu.
  mikhmon-v6:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: A-t-elle changé ?
        id: change
        run: |
          if git diff --quiet HEAD~1 HEAD -- deploy/mikhmon-v6/ 2>/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.change.outputs.build == 'true'
      - name: Log in to GHCR
        if: steps.change.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.change.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: deploy/mikhmon-v6
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mikhmon-v6:v3.20-fr
            ghcr.io/${{ github.repository_owner }}/mikhmon-v6:latest

  # Édition v7, corrigée : une couche mince sur l'image de l'exploitant, qui
  # retire la division par 100 du prix des tickets (voir deploy/mikhmon-v7).
  #
  # MULTI-ARCHITECTURE, contrairement à la v6 : la v6 ne tourne que sur le
  # relais, en x86 ; la v7 est installée SUR LES ROUTEURS, qui sont en ARM. Une
  # image construite pour la seule architecture du runner ne démarrerait sur
  # aucun MikroTik du parc.
  mikhmon-v7:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: A-t-elle changé ?
        id: change
        run: |
          if git diff --quiet HEAD~1 HEAD -- deploy/mikhmon-v7/ 2>/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.change.outputs.build == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.change.outputs.build == 'true'
      - name: Log in to GHCR
        if: steps.change.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.change.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: deploy/mikhmon-v7
          push: true
          # Les mêmes architectures que l'image amont, moins s390x qu'aucun
          # équipement du parc n'utilise.
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          # FORMAT DOCKER v2, PAS OCI. RouterOS ne sait pas lire un manifeste
          # OCI : il extrait les premières couches — assez pour que PHP démarre
          # — et abandonne les suivantes, celles qui portent l'application. Le
          # conteneur tourne alors en répondant 404 sur toute URL, ce qui ne
          # ressemble à aucune panne connue.
          #
          # buildx produit de l'OCI dès qu'il joint une attestation de
          # provenance ou un SBOM, ce qu'il fait PAR DÉFAUT. Les trois réglages
          # vont ensemble : désactiver les deux attestations, et demander
          # explicitement les types de média Docker.
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: |
            ghcr.io/${{ github.repository_owner }}/mikhmon-v7:prix-corrige
            ghcr.io/${{ github.repository_owner }}/mikhmon-v7:latest

  deploy:
    needs: build
    # Opt-in: set repo variable DEPLOY_ENABLED=true once the VPS + secrets are
    # ready, so merging to main before then builds the image without a failing
    # deploy step.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée DÉDIÉE au
    # déploiement), VPS_HOST_KEY (clé publique d'hôte, pour épingler le serveur).
    #
    # POURQUOI PAS `docker compose` : il n'y a pas de docker-compose.yml sur le
    # VPS. `slh-app` est un `docker run` manuel qui porte 14 labels Traefik et
    # 36 variables d'environnement de production qui n'existent nulle part
    # ailleurs — les recréer depuis un fichier, c'est risquer de les perdre.
    # La bascule est donc faite par /root/deploy-slh-ghcr.sh, qui reprend
    # l'environnement et les labels du conteneur VIVANT, garde un conteneur de
    # rollback et revient en arrière tout seul si le nouveau ne démarre pas ou
    # si la page d'accueil ne répond pas 200.
    #
    # POURQUOI PAS appleboy/ssh-action : ce job détient un accès à la machine de
    # production. Un `ssh` direct évite d'exposer cette clé à une action tierce
    # et laisse voir exactement ce qui est envoyé sur le fil.
    #
    # La clé est contrainte côté serveur par une commande forcée
    # (authorized_keys) qui n'accepte QU'UN SHA de 40 caractères hexadécimaux :
    # même divulguée, elle ne peut que déclencher le déploiement d'une image
    # déjà construite par cette CI — pas ouvrir un shell.
    steps:
      - name: Bascule du conteneur de production
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY"  > ~/.ssh/slh_deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/slh_deploy ~/.ssh/known_hosts
          # StrictHostKeyChecking=yes + known_hosts épinglé : si l'empreinte du
          # serveur change, on refuse au lieu de livrer à un inconnu.
          # Reprise sur echec : le trajet reseau GitHub -> hebergeur a deja
          # expire une fois (16:54 UTC le 12/08) alors que le VPS allait bien.
          # Sans reprise, un incident passager laisse la production un commit
          # en arriere avec une croix rouge, et il faut relancer a la main. Le
          # script de bascule est idempotent : reessayer ne coute rien, et s'il
          # a deja bascule, il repond << deja en ligne >>.
          for attempt in 1 2 3; do
            if ssh -i ~/.ssh/slh_deploy \
                   -o IdentitiesOnly=yes \
                   -o StrictHostKeyChecking=yes \
                   -o UserKnownHostsFile=~/.ssh/known_hosts \
                   -o ConnectTimeout=20 \
                   "$VPS_USER@$VPS_HOST" "$SHA"; then
              exit 0
            fi
            echo "tentative $attempt echouee" >&2
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          # Echec des trois tentatives = le VPS est injoignable EN ENTREE. Une
          # capture tcpdump sur la machine pendant une tentative n'a montre
          # aucun paquet SYN venu de GitHub : le blocage est en amont (pare-feu
          # reseau de l'hebergeur), rien ne peut le corriger d'ici.
          #
          # Ce n'est PAS un echec de livraison : le VPS tire lui-meme la
          # derniere image toutes les deux minutes (slh-pull-deploy.timer), en
          # comparant l'empreinte de << latest >> sur GHCR a celle du conteneur
          # vivant. Ce chemin-la ne depend d'aucune connexion entrante. On
          # signale donc bruyamment sans echouer, sinon chaque livraison
          # s'accompagne d'une croix rouge qui ne veut rien dire.
          echo "::warning::bascule directe impossible (VPS injoignable en entree) — le tirage automatique du VPS prendra le relais sous 2 min"
          exit 0
