name: MikHmon v7 armv5 (MikroTik sans FPU)

# Image séparée pour les cartes ARM dont RouterOS n'expose pas d'unité
# flottante (hAP be lite…) — voir deploy/mikhmon-v7-armv5/Dockerfile.
#
# Workflow À PART de deploy.yml, déclenché sur n'importe quelle branche : on
# peut publier cette image sans pousser sur main (donc sans redéployer l'app).
on:
  push:
    paths:
      - deploy/mikhmon-v7-armv5/**
      - .github/workflows/mikhmon-armv5.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/mikhmon-v7-armv5
          push: true
          # UNE seule plateforme : RouterOS « arm » préférerait l'arm/v7 si on
          # la joignait, et c'est justement celle qui plante sur ces cartes.
          platforms: linux/arm/v5
          # Format Docker v2, pas OCI : RouterOS lit mal l'OCI (voir deploy.yml).
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: ghcr.io/${{ github.repository_owner }}/mikhmon-v7:armv5
