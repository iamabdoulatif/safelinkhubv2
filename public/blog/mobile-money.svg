<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Paiement mobile money sur hotspot Wi-Fi">
  <rect width="800" height="450" fill="#F0EDE6"/>
  <!-- trame décorative : croix éditoriales -->
  <g stroke="#D8D2C6" stroke-width="3">
    <path d="M90 80h24M102 68v24"/>
    <path d="M690 350h24M702 338v24"/>
    <path d="M640 90h24M652 78v24"/>
    <path d="M120 340h24M132 328v24"/>
  </g>

  <!-- pièces mobile money -->
  <g>
    <circle cx="565" cy="255" r="58" fill="#EAB308" stroke="#1C1917" stroke-width="6"/>
    <text x="565" y="274" font-family="ui-monospace, Menlo, monospace" font-size="50" font-weight="bold" fill="#1C1917" text-anchor="middle">F</text>
    <circle cx="640" cy="315" r="42" fill="#FBFAF8" stroke="#1C1917" stroke-width="6"/>
    <text x="640" y="329" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="bold" fill="#1C1917" text-anchor="middle">F</text>
  </g>

  <!-- téléphone -->
  <g>
    <rect x="255" y="85" width="180" height="310" fill="#FBFAF8" stroke="#1C1917" stroke-width="7"/>
    <rect x="255" y="85" width="180" height="46" fill="#1C1917"/>
    <circle cx="345" cy="108" r="7" fill="#EAB308"/>
    <!-- arcs wi-fi sur l'écran -->
    <g fill="none" stroke="#1C1917" stroke-width="9" stroke-linecap="square">
      <path d="M295 218a70 70 0 0 1 100 0"/>
      <path d="M315 244a42 42 0 0 1 60 0"/>
    </g>
    <rect x="337" y="262" width="16" height="16" fill="#1C1917"/>
    <!-- bouton payer -->
    <rect x="285" y="310" width="120" height="44" fill="#EAB308" stroke="#1C1917" stroke-width="5"/>
    <text x="345" y="339" font-family="ui-monospace, Menlo, monospace" font-size="21" font-weight="bold" fill="#1C1917" text-anchor="middle">PAYER</text>
  </g>

  <!-- flèche transaction -->
  <g stroke="#1C1917" stroke-width="6" fill="none">
    <path d="M448 240h64"/>
    <path d="M496 220l24 20-24 20" fill="none"/>
  </g>

  <!-- ticket voucher -->
  <g>
    <rect x="130" y="170" width="92" height="56" fill="#FBFAF8" stroke="#1C1917" stroke-width="5" transform="rotate(-8 176 198)"/>
    <text x="176" y="205" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="bold" fill="#A16207" text-anchor="middle" transform="rotate(-8 176 198)">24H</text>
  </g>
</svg>
