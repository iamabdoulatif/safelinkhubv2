<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="SafeLinkHub">
  <title>SafeLinkHub</title>
  <!-- Favicon / chip : à 16 px un port d'accent ne fait plus qu'un pixel. Le
       lime passe en champ plein (pastille) et porte la couleur de marque, le S
       routé + le port restent en encre. Lisible sur onglet clair comme sombre. -->
  <rect width="32" height="32" rx="7" fill="#D6F344"/>
  <path d="M24 8 H13 V16 H19 V23.2 H7.8" fill="none" stroke="#151515"
        stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="22.5" y="4.5" width="6" height="6" rx="1.6" fill="#151515"/>
</svg>
