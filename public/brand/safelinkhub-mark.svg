<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     style="color:#151515" role="img" aria-label="SafeLinkHub">
  <title>SafeLinkHub</title>
  <!-- Hub Badge : pastille-hub + S routé en négatif qui sort vers un port lime.
       Le disque est en currentColor et le S est un VRAI trou (mask) : inliné
       dans la page, le disque suit la couleur du texte parent (encre sur fond
       clair, blanc sur fond sombre) et le S laisse voir le fond — un seul
       tracé pour tous les fonds. L'accent (port) est en slh-accent : sur un
       aplat lime, poser slh-accent a currentColor pour que le port suive
       l'encre. En <img>, currentColor retombe sur l'encre #151515 ci-dessus. -->
  <mask id="slhb-mark">
    <circle cx="16" cy="16" r="14.5" fill="#fff"/>
    <path d="M24 8 H13 V16 H19 V23.2 H7.8" fill="none" stroke="#000"
          stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <circle cx="16" cy="16" r="14.5" fill="currentColor" mask="url(#slhb-mark)"/>
  <rect x="23" y="3" width="6" height="6" rx="1.6"
        fill="var(--slh-accent, #D6F344)" stroke="currentColor" stroke-width="0.7"/>
</svg>
